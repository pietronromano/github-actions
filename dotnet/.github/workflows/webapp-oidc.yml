# Deploy webapp with OpenID Connect
# SEE: my-readme-webapp-oidc.azcli
#########################################################################################

name: webapp-oidc

on:
    # [push]
    workflow_dispatch:

permissions:
      id-token: write
      contents: read

env:
  AZURE_WEBAPP_NAME: pnrghactionswebapp1    # Set this to your application's name
  AZURE_WEBAPP_PACKAGE_PATH: '.'      # Set this to the path to your web app project, defaults to the repository root
  DOTNET_VERSION: '9.0.x'           # Set this to the dot net version to use

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: Development # Secrets must be stored in ths Environment in Github
    defaults:
      run:
        working-directory: DotNetHttpServer
    steps:
      # Check out the repo
      - uses: actions/checkout@v5.0.0

      # Login to Azure
      - uses: azure/login@v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Setup .NET Core SDK
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }} 
      
      # Run dotnet build and publish
      - name: dotnet build and publish
        run: |
          dotnet restore
          dotnet build --configuration Release
          dotnet publish -c Release --property:PublishDir='${{env.DOTNET_ROOT}}/myapp' 
          
      # Deploy to Azure Web apps
      - name: 'Run Azure webapp deploy action using publish profile credentials'
        uses: azure/webapps-deploy@v3
        with: 
          app-name: ${{ env.AZURE_WEBAPP_NAME }} # Replace with your app name
          package: '${{env.DOTNET_ROOT}}/myapp'
      
      - name: logout
        run: |
          az logout