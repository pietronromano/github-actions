name: Use Composite Action
on: [push, workflow_dispatch]

jobs:
  composite-action-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run my own composite action
        id: composite-action-step
        uses: ./.github/actions/composite # relative to project root folder, don't have to specify /action.yml
        with:
          question: 'This is my question'

      - name: Show output
        run: echo "The output is... ${{ steps.composite-action-step.outputs.answer }} " 
